# BrOdds API — local development stack.
#
#   docker compose up -d           start postgres + redis + api + scheduler
#   docker compose logs -f api     follow API logs
#   docker compose down            stop everything
#   docker compose down -v         stop and wipe data volumes
#
# Production deployment (Path C roadmap):
#   - Use a managed Postgres (Neon, Supabase, RDS) instead of the bundled service
#   - Use a managed Redis (Upstash, Elasticache) for low-latency cache
#   - Run multiple API replicas behind a load balancer
#   - Run the scheduler as a single replica (it's intentionally not horizontally scaled)

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-brodds}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brodds_dev_password}
      POSTGRES_DB:       ${POSTGRES_DB:-brodds}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-brodds}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-brodds}:${POSTGRES_PASSWORD:-brodds_dev_password}@postgres:5432/${POSTGRES_DB:-brodds}
      REDIS_URL:    redis://redis:6379/0
      API_KEY:      ${BRODDS_API_KEY:-dev_local_key_change_me}
      LOG_LEVEL:    ${LOG_LEVEL:-INFO}
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src

  scheduler:
    build: .
    command: python -m src.scheduler.jobs
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-brodds}:${POSTGRES_PASSWORD:-brodds_dev_password}@postgres:5432/${POSTGRES_DB:-brodds}
      REDIS_URL:    redis://redis:6379/0
      LOG_LEVEL:    ${LOG_LEVEL:-INFO}
      # Proxy config — see .env.example
      PROXY_URL:    ${PROXY_URL:-}
      SCRAPE_INTERVAL_SECONDS: ${SCRAPE_INTERVAL_SECONDS:-90}
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    volumes:
      - ./src:/app/src

volumes:
  pgdata:
