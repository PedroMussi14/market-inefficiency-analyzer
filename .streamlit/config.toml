# Streamlit configuration for the dashboard.
# The custom CSS in dashboard/theme.py is designed for this light base theme;
# pinning it here keeps the look identical whatever the OS/browser setting.
# Colours mirror COLORS in dashboard/theme.py.

[theme]
base = "light"
primaryColor = "#1d5fd6"
backgroundColor = "#f3f5f7"
secondaryBackgroundColor = "#ffffff"
textColor = "#1b1d1f"
borderColor = "#d6d9dd"
baseRadius = "10px"

[theme.sidebar]
backgroundColor = "#f3f5f7"
secondaryBackgroundColor = "#ffffff"

[client]
toolbarMode = "minimal"      # hide developer options such as "Deploy"

[browser]
gatherUsageStats = false
