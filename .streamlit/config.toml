# Streamlit configuration for the dashboard.
# The custom CSS in dashboard/theme.py is designed for a dark base theme;
# pinning it here keeps the look identical whatever the OS/browser setting.

[theme]
base = "dark"
primaryColor = "#00e5a0"
backgroundColor = "#0d0f14"
secondaryBackgroundColor = "#161922"
textColor = "#e8ecf3"

[client]
toolbarMode = "minimal"      # hide developer options such as "Deploy"

[browser]
gatherUsageStats = false
